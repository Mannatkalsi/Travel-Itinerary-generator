<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Travel Itinerary Generator</title>
  </head>
  <body>
    <main class="container">
      <section class="intro">
        <p class="small-heading">AI TRAVEL PLANNER</p>
        <h1>Create your prefect travel itinerary</h1>
        <p class="description">
          Enter a few details and receive a personalised day-by-day travel plan.
        </p>
      </section>
      <section class="planner-card">
        <form id="travel-form">
          <div class="form-group">
            <label for="destination">Destination</label>
            <input
              type="text"
              id="destination"
              placeholder="For example, Paris"
              autofocus
              required
              autocomplete="off"
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="days">Number of days</label>
              <input type="number" id="days" min="1" placeholder="5" required />
            </div>
            <div class="form-group">
              <label for="budget">Budget</label>
              <select id="budget" required>
                <option value="">Select budget</option>
                <option value="budget-friendly">Budget-friendly</option>
                <option value="moderate">Moderate</option>
                <option value="comfortable">Comfortable</option>
                <option value="luxury">Luxury</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="preferences">
              Preferences
              <span>Optional</span>
            </label>
            <textarea
              id="preferences"
              rows="4"
              placeholder="For example, vegan food, scenic drive, beaches, short walks or kids friendly activities"
            ></textarea>
          </div>
          <button type="submit">Generator itinerary</button>
        </form>
      </section>
      <section id="result-section" class="result-sections">
        <div id="result"></div>
      </section>
    </main>
    <footer>
      This AI project coded by
      <a href="https://github.com/Mannatkalsi" target="_blank">Mannat Kalsi</a>
      and is
      <a
        href="https://github.com/Mannatkalsi/Travel-Itinerary-generator"
        target="_blank"
      >
        open-sourced on Github</a
      >
      and is hosted on Netlify.
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
